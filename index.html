té","sourcePages":"6","sections":[{"heading":"La devise de la France","fr":["La devise de la France « liberté, égalité, fraternité » consacre les valeurs fondatrices de la République française, repères communs pour le vivre ensemble.","Elle est inscrite sur le fronton des bâtiments publics, notamment les préfectures et les mairies."],"en":["France’s motto, “Liberty, Equality, Fraternity”, establishes the founding values of the French Republic and provides common reference points for living together.","It appears on the front of public buildings, including prefectures and town halls."],"vocab":[["la devise","motto"],["le fronton","front/pediment"],["le vivre ensemble","living together"]],"note":null,"noteEn":null},{"heading":"A. Liberté","fr":["Les femmes et les hommes sont libres dans leurs choix, leurs opinions et leur manière de penser, de s’exprimer et de vivre.","La liberté est une valeur fondamentale inscrite dans la Déclaration des droits de l’homme et du citoyen de 1789. Son article 4 affirme que la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui : chacun peut agir librement tant qu’il ne gêne pas les autres et respecte ce qui est défini par la loi.","Les libertés sont les mêmes pour l’ensemble des citoyens, dans le respect des lois."],"en":["Women and men are free in their choices, opinions and ways of thinking, expressing themselves and living.","Liberty is a fundamental value written into the 1789 Declaration of the Rights of Man and of the Citizen. Article 4 states that liberty means being able to do anything that does not harm others: everyone may act freely as long as they do not interfere with others and respect the limits defined by law.","Freedoms are the same for all citizens and must be exercised in accordance with the law."],"vocab":[["nuire à autrui","to harm others"],["s’exprimer","to express oneself"],["une valeur fondamentale","fundamental value"]],"note":"La liberté ne signifie pas l’absence de règles : elle s’exerce avec le respect des autres et de la loi.","noteEn":"Freedom does not mean the absence of rules: it is exercised with respect for others and the law."},{"heading":"B. Égalité","fr":["L’égalité est un principe fondamental de la République française, affirmé à l’article 1er de la Constitution de 1958.","Tous les citoyens ont les mêmes droits quels que soient leur sexe, leur origine, leur religion, leurs opinions ou leur orientation sexuelle.","L’égalité entre les femmes et les hommes est inscrite dans le préambule de la Constitution depuis 1946 et s’applique dans tous les domaines, notamment le travail, la santé et l’éducation."],"en":["Equality is a fundamental principle of the French Republic, affirmed in Article 1 of the 1958 Constitution.","All citizens have the same rights regardless of sex, origin, religion, opinions or sexual orientation.","Equality between women and men has been included in the preamble to the Constitution since 1946 and applies in all areas, including work, health and education."],"vocab":[["le préambule","preamble"],["quel que soit","regardless of"],["s’appliquer","to apply"]],"note":null,"noteEn":null}]},{"id":"p1-discriminations-et-fraternit","part":1,"title":"Discriminations et fraternité","sourcePages":"6-7","sections":[{"heading":"La France condamne les discriminations","fr":["Une discrimination consiste à traiter différemment une personne par rapport à une autre dans une situation comparable, par exemple pour le logement, le travail ou les loisirs, en raison de son origine, de son sexe, de son orientation sexuelle, de son opinion politique, de son âge, de ses convictions religieuses ou de son apparence physique.","Les discriminations sont punies par la loi. L’État lutte notamment contre le sexisme, le racisme, l’antisémitisme, la discrimination fondée sur un critère religieux, ainsi que la haine et les discriminations liées à l’orientation sexuelle."],"en":["Discrimination means treating one person differently from another in a comparable situation, for example in housing, work or leisure, because of origin, sex, sexual orientation, political opinion, age, religious beliefs or physical appearance.","Discrimination is punishable by law. The State notably combats sexism, racism, antisemitism, discrimination based on religion, and hatred or discrimination linked to sexual orientation."],"vocab":[["le sexisme","sexism"],["le racisme","racism"],["l’antisémitisme","antisemitism"]],"note":null,"noteEn":null},{"heading":"C. Fraternité","fr":["La France est fondée sur la volonté des citoyens de vivre ensemble. Cette volonté se traduit par la fraternité entre tous. La fraternité républicaine est civique : elle repose sur la capacité à reconnaître un semblable malgré les différences.","La fraternité implique une solidarité collective. La Nation assure une protection aux individus, par exemple grâce à la Sécurité sociale. Remplir ses obligations fiscales est aussi un acte solidaire, car les impôts financent les services publics au bénéfice de tous.","La solidarité est également intergénérationnelle : en cotisant, les salariés contribuent notamment au financement des retraites. L’engagement associatif et les collectes humanitaires sont d’autres formes de solidarité."],"en":["France is founded on citizens’ willingness to live together. Republican fraternity is civic and rests on recognising others as fellow members of society despite differences.","Fraternity involves collective solidarity. The Nation protects individuals, for example through Social Security. Paying taxes is also an act of solidarity because taxes finance public services for everyone.","Solidarity is also intergenerational: employees’ contributions help finance pensions. Involvement in associations and humanitarian collections are other forms of solidarity."],"vocab":[["la solidarité","solidarity"],["cotiser","to contribute"],["une retraite","pension"]],"note":null,"noteEn":null}]},{"id":"p1-les-symboles-de-la-france","part":1,"title":"Les symboles de la France","sourcePages":"8-9","sections":[{"heading":"La fête nationale","fr":["Le 14 juillet 1789, le peuple de Paris prend la Bastille, une prison royale. Cet événement marque le début de la Révolution française.","Le 14 juillet 1790 est célébrée la Fête de la Fédération. Depuis 1880, le 14 juillet est consacré comme jour de fête nationale afin de commémorer ces deux événements."],"en":["On 14 July 1789, the people of Paris stormed the Bastille, a royal prison. This event marked the beginning of the French Revolution.","On 14 July 1790, the Fête de la Fédération was celebrated. Since 1880, 14 July has been France’s national holiday in memory of these two events."],"vocab":[["la Bastille","the Bastille"],["commémorer","to commemorate"]],"note":null,"noteEn":null},{"heading":"L’hymne national","fr":["En 1792, l’hymne national français, La Marseillaise, est écrit par Rouget de Lisle. Il est étudié par les enfants à l’école primaire."],"en":["In 1792, the French national anthem, La Marseillaise, was written by Rouget de Lisle. Children study it in primary school."],"vocab":[["l’hymne national","national anthem"]],"note":null,"noteEn":null},{"heading":"La langue officielle","fr":["La langue officielle de la République est le français."],"en":["The official language of the Republic is French."],"vocab":[["la langue officielle","official language"]],"note":null,"noteEn":null},{"heading":"Marianne","fr":["Marianne, une femme portant un bonnet phrygien, symbole de la liberté, est devenue le symbole de la République.","Elle apparaît sur les documents de l’administration française. Sa statue, placée dans les mairies, rappelle la Révolution française."],"en":["Marianne, a woman wearing a Phrygian cap, a symbol of liberty, became a symbol of the Republic.","She appears on French administrative documents. Her statue, displayed in town halls, recalls the French Revolution."],"vocab":[["un bonnet phrygien","Phrygian cap"]],"note":null,"noteEn":null},{"heading":"Le drapeau tricolore et le coq","fr":["Le drapeau tricolore bleu, blanc et rouge est associé à la Révolution. Il devient le drapeau officiel de la France en 1794, sauf pendant la période de la Restauration.","Le coq représente la fierté, le courage et la vigilance. Il n’a pas de statut officiel dans la Constitution, mais il est largement reconnu comme un symbole national."],"en":["The blue, white and red tricolour flag is associated with the Revolution. It became France’s official flag in 1794, except during the Restoration period.","The rooster represents pride, courage and vigilance. It has no official status in the Constitution, but it is widely recognised as a national symbol."],"vocab":[["le drapeau tricolore","tricolour flag"],["le coq","rooster"]],"note":null,"noteEn":null}]},{"id":"p1-rpublique-indivisible-et-laque","part":1,"title":"République indivisible et laïque","sourcePages":"10-13","sections":[{"heading":"Les principes de la République","fr":["L’article 1er de la Constitution du 4 octobre 1958 affirme que la France est une République indivisible, laïque, démocratique et sociale.","La Constitution est l’acte fondateur de l’État. Elle définit l’organisation du pays, fixe les droits et libertés, répartit les pouvoirs et se situe au sommet de la hiérarchie des normes."],"en":["Article 1 of the Constitution of 4 October 1958 states that France is an indivisible, secular, democratic and social Republic.","The Constitution is the founding act of the State. It defines how the country is organised, sets out rights and freedoms, distributes powers and stands at the top of the hierarchy of legal rules."],"vocab":[["la Constitution","Constitution"],["la hiérarchie des normes","hierarchy of legal norms"]],"note":null,"noteEn":null},{"heading":"A. Une République indivisible","fr":["Aucun individu ou groupe ne peut décider à la place de l’ensemble des Français. Les décisions sont prises par les représentants élus ou directement par le peuple lors des référendums.","Tous les Français, en métropole comme en outre-mer, sont soumis aux mêmes lois et ont les mêmes droits et devoirs. La France a une seule langue officielle : le français."],"en":["No individual or group may decide in place of the French people as a whole. Decisions are taken by elected representatives or directly by the people through referendums.","All French citizens, in metropolitan France and overseas, are subject to the same laws and have the same rights and duties. France has one official language: French."],"vocab":[["indivisible","indivisible"],["un référendum","referendum"]],"note":null,"noteEn":null},{"heading":"B. Une République laïque","fr":["La laïcité est un principe essentiel de la République, de valeur constitutionnelle, officiellement célébré le 9 décembre.","Elle garantit la liberté de conscience : chacun est libre d’avoir une religion, de ne pas en avoir, d’en changer ou de ne plus en avoir. Elle garantit aussi la liberté de pratiquer sa religion dans les limites du respect de l’ordre public.","La laïcité garantit le libre exercice des cultes, le respect de toutes les croyances et impose la neutralité de l’État."],"en":["Secularism is an essential constitutional principle of the Republic and is officially commemorated on 9 December.","It guarantees freedom of conscience: everyone is free to have a religion, have none, change religion or stop having one. It also guarantees freedom to practise religion within the limits required by public order.","Secularism guarantees freedom of worship, respect for all beliefs and requires State neutrality."],"vocab":[["la laïcité","secularism"],["la liberté de conscience","freedom of conscience"],["l’ordre public","public order"]],"note":null,"noteEn":null},{"heading":"Neutralité, prosélytisme et espaces","fr":["La loi de 1905 organise la séparation des Églises et de l’État. L’État, les collectivités territoriales et les services publics sont neutres vis-à-vis des religions.","Le prosélytisme consiste à chercher à convaincre quelqu’un d’adopter une religion. Il est autorisé tant qu’il n’y a ni violence, menace ni pression, mais il est interdit aux agents dans les services publics.","Dans l’espace public, chacun peut manifester ses convictions sous réserve des règles de sécurité et d’ordre public. Dans les établissements scolaires publics, les personnels sont neutres et les élèves ne peuvent porter des signes ou tenues manifestant ostensiblement une appartenance religieuse."],"en":["The 1905 law organises the separation of Churches and the State. The State, local authorities and public services are neutral towards religions.","Proselytism means seeking to convince someone to adopt a religion. It is allowed provided there is no violence, threat or pressure, but is prohibited for public-service employees while carrying out their duties.","In public spaces, people may express their convictions subject to public-order and safety rules. In public schools, staff are neutral and pupils may not wear signs or clothing that conspicuously display a religious affiliation."],"vocab":[["le prosélytisme","proselytism"],["ostensiblement","conspicuously"]],"note":null,"noteEn":null}]},{"id":"p1-rpublique-dmocratique-et-sociale","part":1,"title":"République démocratique et sociale","sourcePages":"14","sections":[{"heading":"C. Une République démocratique","fr":["La souveraineté nationale appartient au peuple, qui l’exerce par ses représentants et par la voie du référendum.","Les citoyens majeurs disposant de leurs droits civils et politiques ont le droit de voter et, dans les conditions fixées par la loi, de se présenter aux élections."],"en":["National sovereignty belongs to the people, who exercise it through their representatives and by referendum.","Adult citizens who retain their civil and political rights may vote and, under the conditions set by law, stand for election."],"vocab":[["la souveraineté","sovereignty"],["le suffrage universel","universal suffrage"]],"note":null,"noteEn":null},{"heading":"D. Une République sociale","fr":["Le caractère social de la République découle du principe d’égalité. L’État favorise l’égalité des chances et améliore la condition des personnes les plus fragiles.","Il intervient notamment dans l’éducation, le logement, l’emploi et la santé, par exemple grâce à l’école gratuite, au logement social, aux aides au retour à l’emploi et à la Sécurité sociale."],"en":["The social nature of the Republic follows from the principle of equality. The State promotes equal opportunities and improves conditions for the most vulnerable.","It acts notably in education, housing, employment and health, for example through free schooling, social housing, return-to-work assistance and Social Security."],"vocab":[["l’égalité des chances","equal opportunities"],["le logement social","social housing"]],"note":null,"noteEn":null}]},{"id":"p2-dmocratie-tat-de-droit-et-institutions","part":2,"title":"Démocratie, État de droit et institutions","sourcePages":"16","sections":[{"heading":"Démocratie et État de droit","fr":["La France est une démocratie et un État de droit : la loi doit être respectée par tous, y compris par l’État. L’État de droit s’oppose à l’État arbitraire.","Le principe démocratique est formulé comme le « gouvernement du peuple, par le peuple et pour le peuple ». La Constitution actuelle est celle de la Ve République, adoptée en 1958.","L’État de droit repose sur la protection des libertés fondamentales, la séparation des trois pouvoirs et l’indépendance de la justice."],"en":["France is a democracy governed by the rule of law: the law must be respected by everyone, including the State. The rule of law is opposed to arbitrary government.","The democratic principle is expressed as “government of the people, by the people and for the people”. The current Constitution is that of the Fifth Republic, adopted in 1958.","The rule of law rests on the protection of fundamental freedoms, separation of powers and judicial independence."],"vocab":[["l’État de droit","rule of law"],["l’indépendance de la justice","judicial independence"]],"note":null,"noteEn":null},{"heading":"Les trois pouvoirs","fr":["Le pouvoir législatif élabore et vote les lois : il appartient au Parlement.","Le pouvoir exécutif définit la politique de la Nation et met en œuvre les lois : il est exercé par le Gouvernement.","Le pouvoir judiciaire rend la justice : il est exercé par les juges."],"en":["The legislative power drafts and votes on laws: it belongs to Parliament.","The executive power defines national policy and implements laws: it is exercised by the Government.","The judicial power administers justice: it is exercised by judges."],"vocab":[["le pouvoir législatif","legislative power"],["le pouvoir exécutif","executive power"],["le pouvoir judiciaire","judicial power"]],"note":null,"noteEn":null},{"heading":"Les principales institutions","fr":["Le Président de la République est chef de l’État et des armées. Il est élu au suffrage universel direct pour cinq ans, renouvelables une fois. Il nomme le Gouvernement sur proposition du Premier ministre.","Le Parlement est composé de l’Assemblée nationale et du Sénat. Les 577 députés sont élus directement pour cinq ans. Les 348 sénateurs sont élus au suffrage universel indirect pour six ans.","Le Conseil constitutionnel veille à la conformité des lois avec la Constitution et contrôle la régularité des élections nationales."],"en":["The President is head of State and commander-in-chief. The President is elected by direct universal suffrage for five years, renewable once, and appoints the Government on the proposal of the Prime Minister.","Parliament consists of the National Assembly and the Senate. The 577 deputies are directly elected for five years. The 348 senators are elected indirectly for six years.","The Constitutional Council checks that laws comply with the Constitution and oversees the regularity of national elections."],"vocab":[["un député","deputy/MP"],["un sénateur","senator"],["le Conseil constitutionnel","Constitutional Council"]],"note":null,"noteEn":null}]},{"id":"p2-le-droit-de-vote","part":2,"title":"Le droit de vote","sourcePages":"17-18","sections":[{"heading":"Conditions pour voter","fr":["Le droit de vote permet aux citoyens d’exprimer leur volonté à l’occasion d’une élection. Le suffrage est universel.","Le premier vote au suffrage universel a lieu en 1848 mais seulement pour les hommes. Les femmes obtiennent le droit de vote en avril 1944 et votent pour la première fois en avril 1945.","Pour voter, il faut notamment être majeur, ne pas être privé de ses droits civiques, être inscrit sur les listes électorales et avoir la nationalité requise selon l’élection."],"en":["The right to vote allows citizens to express their will in an election. Suffrage is universal.","The first universal-suffrage vote took place in 1848 but only for men. Women obtained the right to vote in April 1944 and voted for the first time in April 1945.","To vote, a person must notably be an adult, retain civic rights, be registered on the electoral roll and have the nationality required for the election."],"vocab":[["les droits civiques","civic rights"],["les listes électorales","electoral roll"]],"note":null,"noteEn":null},{"heading":"Le vote est personnel et secret","fr":["Dans le bureau de vote, l’électeur passe par l’isoloir, place son bulletin dans une enveloppe puis dépose cette enveloppe dans l’urne.","Les candidats disposent de panneaux d’affichage électoral. Leur dégradation n’est pas tolérée."],"en":["At the polling station, the voter goes into a voting booth, puts the ballot in an envelope and then places it in the ballot box.","Candidates have official election display boards. Damaging these boards is not permitted."],"vocab":[["un isoloir","voting booth"],["une urne","ballot box"],["un bulletin","ballot paper"]],"note":null,"noteEn":null}]},{"id":"p2-organisation-territoriale","part":2,"title":"Organisation territoriale","sourcePages":"19-21","sections":[{"heading":"Décentralisation et communes","fr":["Dans le cadre de la décentralisation, l’État transfère des compétences et des moyens à des collectivités territoriales. L’État reste représenté localement par les préfets.","La France compte 34 875 communes au 1er janvier 2025. Chaque commune est gérée par un maire et un conseil municipal élus pour six ans.","Les communes sont responsables notamment des écoles primaires publiques, de certaines activités sportives et culturelles, des routes communales et de l’état civil. Elles peuvent se regrouper en intercommunalités."],"en":["As part of decentralisation, the State transfers responsibilities and resources to local authorities, while prefects represent the State locally.","France had 34,875 communes on 1 January 2025. Each is managed by a mayor and municipal council elected for six years.","Communes are notably responsible for public primary schools, certain sporting and cultural activities, local roads and civil-status records. They may group together in intercommunal structures."],"vocab":[["la décentralisation","decentralisation"],["un préfet","prefect"],["l’état civil","civil status"]],"note":null,"noteEn":null},{"heading":"Départements, régions et outre-mer","fr":["Les départements sont administrés par les conseils départementaux et gèrent notamment les collèges publics, l’action sociale, les routes départementales, la protection de l’enfance et l’aide aux personnes âgées. La France compte 101 départements.","La France compte 13 régions métropolitaines et 5 régions d’outre-mer. Les régions s’occupent notamment des transports publics, du développement économique, de la formation professionnelle et des lycées publics.","La France compte également 12 territoires d’outre-mer. Cinq sont à la fois départements et régions : Guadeloupe, Martinique, Mayotte, Guyane et La Réunion."],"en":["Departments are administered by departmental councils and notably manage public middle schools, social action, departmental roads, child protection and support for older people. France has 101 departments.","France has 13 metropolitan regions and 5 overseas regions. Regions notably manage public transport, economic development, vocational training and public high schools.","France also has 12 overseas territories. Five are both departments and regions: Guadeloupe, Martinique, Mayotte, French Guiana and Réunion."],"vocab":[["un département","department"],["une région","region"],["l’outre-mer","overseas territories"]],"note":null,"noteEn":null}]},{"id":"p2-lunion-europenne","part":2,"title":"L’Union européenne","sourcePages":"22-23","sections":[{"heading":"Construction européenne","fr":["La France est l’un des pays à l’origine de la construction européenne. La Communauté européenne du charbon et de l’acier est créée en 1951. Le traité de Rome de 1957 crée la Communauté économique européenne entre six pays fondateurs.","En 1992, le traité de Maastricht crée l’Union européenne. Elle compte aujourd’hui 27 États membres. Les citoyens français sont aussi citoyens européens.","Les citoyens européens peuvent circuler, travailler, étudier et s’installer dans les autres pays de l’Union dans les conditions prévues."],"en":["France is one of the countries at the origin of European integration. The European Coal and Steel Community was created in 1951. The 1957 Treaty of Rome created the European Economic Community among six founding countries.","In 1992, the Maastricht Treaty created the European Union. It now has 27 member states. French citizens are also EU citizens.","EU citizens may move, work, study and settle in other EU countries under the applicable rules."],"vocab":[["un État membre","member state"],["le traité de Maastricht","Maastricht Treaty"]],"note":null,"noteEn":null},{"heading":"Symboles et repères","fr":["Le drapeau européen comporte douze étoiles. L’hymne est l’Ode à la joie de Beethoven et la devise est « Unie dans la diversité ». La Journée de l’Europe est célébrée le 9 mai.","Les pièces et billets en euros sont mis en circulation à partir de 2002 dans plusieurs États membres."],"en":["The European flag has twelve stars. The anthem is Beethoven’s Ode to Joy and the motto is “United in diversity”. Europe Day is celebrated on 9 May.","Euro banknotes and coins began circulating in 2002 in several member states."],"vocab":[["l’Ode à la joie","Ode to Joy"],["Unie dans la diversité","United in diversity"]],"note":null,"noteEn":null}]},{"id":"p3-cadre-gnral-et-liberts-individuelles","part":3,"title":"Cadre général et libertés individuelles","sourcePages":"25-27","sections":[{"heading":"Droits et devoirs","fr":["Être citoyen d’un État signifie avoir la nationalité de cet État et, à ce titre, avoir des droits et des devoirs.","Certains droits et devoirs sont spécifiques aux citoyens français, comme le droit de vote, la participation à la défense nationale ou au jury d’assises. La plupart s’appliquent cependant à toute personne résidant en France.","Le Code civil fixe les règles essentielles entre les personnes ; le Code pénal définit les infractions et les peines."],"en":["Being a citizen of a State means holding that State’s nationality and therefore having rights and duties.","Some rights and duties are specific to French citizens, such as voting, participation in national defence or jury service. Most, however, apply to everyone living in France.","The Civil Code sets key rules governing relations between individuals; the Criminal Code defines offences and penalties."],"vocab":[["le Code civil","Civil Code"],["le Code pénal","Criminal Code"]],"note":null,"noteEn":null},{"heading":"Liberté de choix, pensée, conscience et religion","fr":["La liberté de choix permet de décider de son mode de vie, de ses relations et de ses projets dans les limites de la loi.","La liberté de pensée et de conscience permet de croire, réfléchir et douter sans contrainte. Chacun est libre de choisir sa religion, de la pratiquer ou de ne pas avoir de religion.","Tout individu est également libre d’adhérer à un parti politique."],"en":["Freedom of choice allows people to decide their way of life, relationships and plans within the limits of the law.","Freedom of thought and conscience allows everyone to believe, reflect and doubt without coercion. Everyone is free to choose and practise a religion or have no religion.","Everyone is also free to join a political party."],"vocab":[["sans contrainte","without coercion"],["adhérer à","to join"]],"note":null,"noteEn":null},{"heading":"Liberté d’expression et de circulation","fr":["Tous les individus sont libres d’exprimer leurs idées et opinions, dans les limites fixées par la loi. Les appels à la violence et certains propos discriminatoires ou incitant à la haine sont interdits.","La liberté d’aller et venir permet de circuler sur le territoire français et dans l’Union européenne. L’espace Schengen organise une zone de libre circulation entre ses États participants.","Des exceptions existent notamment pour les prisonniers, certains étrangers non européens ou en cas de crise exceptionnelle."],"en":["Everyone is free to express ideas and opinions within limits set by law. Calls to violence and certain discriminatory or hate-inciting speech are prohibited.","Freedom of movement allows people to travel within France and the European Union. The Schengen Area organises free movement between participating states.","Exceptions exist notably for prisoners, some non-EU foreigners and in exceptional crises."],"vocab":[["l’espace Schengen","Schengen Area"],["inciter à la haine","to incite hatred"]],"note":null,"noteEn":null}]},{"id":"p3-dignit-vie-prive-et-droit-de-disposer-de-son-corps","part":3,"title":"Dignité, vie privée et droit de disposer de son corps","sourcePages":"28-29","sections":[{"heading":"Vie privée et dignité","fr":["Le droit au respect de la vie privée protège l’intimité, le secret médical et le droit à l’image. Le juge judiciaire veille à ce respect.","La dignité signifie qu’aucune personne ne doit être traitée comme un objet ou un moyen. Sont protégés notamment le droit à la vie, l’intégrité de la personne et l’interdiction de la torture, de l’esclavage et du travail forcé."],"en":["The right to private life protects intimacy, medical confidentiality and image rights. Judges ensure that this right is respected.","Human dignity means that no person should be treated as an object or merely as a means. Protected rights notably include the right to life, personal integrity and the prohibition of torture, slavery and forced labour."],"vocab":[["la dignité","dignity"],["le secret médical","medical confidentiality"],["le droit à l’image","image rights"]],"note":null,"noteEn":null},{"heading":"Disposer de son corps","fr":["Toute personne est libre de faire ses propres choix concernant son corps, notamment sur le plan médical. Le viol, les mutilations, la stérilisation forcée et l’excision sont interdits et sanctionnés.","Le droit à la contraception est garanti, y compris pour les mineurs. Depuis le 8 mars 2024, la liberté de recourir à l’interruption volontaire de grossesse est garantie par la Constitution.","La loi de bioéthique de 2021 autorise la procréation médicalement assistée à toutes les femmes. La gestation pour autrui n’est pas autorisée en France."],"en":["Everyone is free to make personal choices concerning their own body, particularly in medical matters. Rape, mutilation, forced sterilisation and female genital mutilation are prohibited and punishable.","The right to contraception is guaranteed, including for minors. Since 8 March 2024, the freedom to have an abortion has been guaranteed by the Constitution.","The 2021 Bioethics Law authorises medically assisted reproduction for all women. Surrogacy is not permitted in France."],"vocab":[["la contraception","contraception"],["l’IVG","abortion"],["la PMA","medically assisted reproduction"],["la GPA","surrogacy"]],"note":null,"noteEn":null}]},{"id":"p3-sret-justice-et-droits-politiques","part":3,"title":"Sûreté, justice et droits politiques","sourcePages":"29-31","sections":[{"heading":"Sûreté et justice","fr":["Le droit à la sûreté protège contre les arrestations, détentions ou sanctions arbitraires. Une personne arrêtée doit être informée des motifs et de ses droits.","Toute personne peut faire valoir ses droits devant les tribunaux et a droit à un procès équitable, à être entendue, à se défendre et à être assistée par un avocat.","La présomption d’innocence s’applique tant qu’aucune condamnation définitive n’a été prononcée."],"en":["The right to security protects against arbitrary arrest, detention or punishment. An arrested person must be informed of the reasons and their rights.","Everyone may assert their rights before the courts and is entitled to a fair trial, to be heard, to defend themselves and to be assisted by a lawyer.","The presumption of innocence applies until a final conviction has been handed down."],"vocab":[["une garde à vue","police custody"],["un procès équitable","fair trial"],["la présomption d’innocence","presumption of innocence"]],"note":null,"noteEn":null},{"heading":"Droits politiques et environnementaux","fr":["Le droit de vote et le droit de se porter candidat sont au fondement de la démocratie représentative.","La liberté de réunion permet de se rassembler pacifiquement. La liberté de manifester est reconnue, sous réserve notamment d’une déclaration préalable. La liberté d’association est reconnue par la loi du 1er juillet 1901.","Chacun a le droit de vivre dans un environnement équilibré et respectueux de la santé, droit reconnu par la Charte de l’environnement de 2004."],"en":["The right to vote and the right to stand for election are foundations of representative democracy.","Freedom of assembly allows peaceful gatherings. The freedom to demonstrate is recognised, subject notably to prior declaration. Freedom of association is recognised by the law of 1 July 1901.","Everyone has the right to live in a balanced environment that respects health, a right recognised by the 2004 Environmental Charter."],"vocab":[["une manifestation","demonstration"],["une association","association"],["la Charte de l’environnement","Environmental Charter"]],"note":null,"noteEn":null}]},{"id":"p3-lois-institutions-et-devoirs-civiques","part":3,"title":"Lois, institutions et devoirs civiques","sourcePages":"32-36","sections":[{"heading":"Les infractions","fr":["Toute personne vivant en France doit respecter les lois. Les infractions sont classées selon leur gravité.","Les contraventions sont les moins graves et sont notamment sanctionnées par des amendes. Les délits sont plus graves et peuvent entraîner des peines d’emprisonnement. Les crimes sont les infractions les plus graves et peuvent être punis de réclusion criminelle jusqu’à la perpétuité."],"en":["Everyone living in France must obey the law. Offences are classified according to seriousness.","Contraventions are the least serious and are notably punished by fines. Delicts are more serious and may lead to imprisonment. Crimes are the most serious offences and may be punished by long-term criminal imprisonment up to life imprisonment."],"vocab":[["une contravention","minor offence"],["un délit","intermediate offence"],["un crime","serious crime"]],"note":null,"noteEn":null},{"heading":"Respecter les institutions et participer à la démocratie","fr":["Le respect des institutions implique de respecter l’État, les collectivités territoriales, la justice, les agents publics, les élus et les juges dans leurs fonctions.","Le vote n’est pas obligatoire en France, mais il constitue un devoir civique important. Les résultats électoraux doivent être respectés quelles que soient les opinions politiques de chacun.","Les atteintes aux symboles de la République et certains outrages envers des personnes chargées d’une mission de service public peuvent être sanctionnés."],"en":["Respect for institutions means respecting the State, local authorities, the justice system, public officials, elected representatives and judges in their functions.","Voting is not compulsory in France, but it is an important civic duty. Election results must be respected regardless of one’s political opinions.","Attacks on symbols of the Republic and certain insults against people carrying out public-service duties may be punished."],"vocab":[["un devoir civique","civic duty"],["un outrage","contempt/insult offence"]],"note":null,"noteEn":null},{"heading":"Charges publiques, éducation et solidarité","fr":["Tous contribuent, selon leur situation, au financement des services publics par les impôts et les prélèvements.","La scolarité est obligatoire de 3 à 16 ans. Les parents doivent transmettre aux enfants les valeurs de liberté, égalité, fraternité et laïcité, à côté de l’action de l’école.","Le devoir d’assistance à personne en danger impose de porter secours lorsqu’il est possible de le faire sans mettre sa propre vie en péril. La non-assistance à personne en danger est un délit."],"en":["Everyone contributes, according to their situation, to financing public services through taxes and compulsory charges.","Schooling is compulsory from ages 3 to 16. Parents should pass on the values of liberty, equality, fraternity and secularism, alongside the role of schools.","The duty to assist a person in danger requires helping when this can be done without putting one’s own life at risk. Failure to assist a person in danger is an offence."],"vocab":[["les charges publiques","public expenditure"],["porter secours","to provide assistance"],["la non-assistance","failure to assist"]],"note":null,"noteEn":null}]},{"id":"p4-du-moyen-ge-lancien-rgime","part":4,"title":"Du Moyen Âge à l’Ancien Régime","sourcePages":"38-39","sections":[{"heading":"Le Moyen Âge","fr":["Clovis, qui vit de 466 à 511, unifie plusieurs royaumes francs et contribue à la construction de l’unité du territoire. Il adopte la religion chrétienne.","Jeanne d’Arc, née en 1412, joue un rôle important pendant la guerre de Cent Ans entre la France et l’Angleterre. Elle devient une héroïne nationale et un symbole de courage."],"en":["Clovis, who lived from 466 to 511, united several Frankish kingdoms and contributed to the construction of territorial unity. He adopted Christianity.","Joan of Arc, born in 1412, played an important role during the Hundred Years’ War between France and England. She became a national heroine and symbol of courage."],"vocab":[["unifier","to unite"],["la guerre de Cent Ans","Hundred Years’ War"]],"note":null,"noteEn":null},{"heading":"L’Ancien Régime","fr":["L’Ancien Régime est marqué par la monarchie absolue. Henri IV promulgue l’édit de Nantes en 1598, mettant fin aux guerres de religion entre catholiques et protestants.","Molière est une grande figure du théâtre du XVIIe siècle. Louis XIV, le « Roi-Soleil », règne de 1643 à 1715 et fait notamment construire le château de Versailles.","Les philosophes des Lumières, parmi lesquels Rousseau, Voltaire, Diderot, Montesquieu, Condorcet et d’Alembert, défendent la tolérance, la liberté de pensée et le refus de l’arbitraire."],"en":["The Ancien Régime was marked by absolute monarchy. Henry IV issued the Edict of Nantes in 1598, ending the religious wars between Catholics and Protestants.","Molière was a major seventeenth-century theatre figure. Louis XIV, the “Sun King”, reigned from 1643 to 1715 and notably had the Palace of Versailles built.","Enlightenment philosophers including Rousseau, Voltaire, Diderot, Montesquieu, Condorcet and d’Alembert defended tolerance, freedom of thought and rejection of arbitrary power."],"vocab":[["la monarchie absolue","absolute monarchy"],["l’édit de Nantes","Edict of Nantes"],["les Lumières","the Enlightenment"]],"note":null,"noteEn":null}]},{"id":"p4-rvolution-rpublique-et-empire","part":4,"title":"Révolution, République et Empire","sourcePages":"40-41","sections":[{"heading":"La Révolution française","fr":["Le 14 juillet 1789, les Parisiens s’emparent de la Bastille. Cet événement marque le début de la Révolution française et conduit à la fin de la monarchie absolue.","La Déclaration des droits de l’homme et du citoyen est adoptée en 1789. La Fayette contribue à son écriture.","En 1791, une monarchie constitutionnelle limite les pouvoirs de Louis XVI. Il est renversé en 1792 puis guillotiné en 1793."],"en":["On 14 July 1789, Parisians stormed the Bastille. This event marked the beginning of the French Revolution and led to the end of absolute monarchy.","The Declaration of the Rights of Man and of the Citizen was adopted in 1789, with Lafayette contributing to its drafting.","In 1791, a constitutional monarchy limited Louis XVI’s powers. He was overthrown in 1792 and guillotined in 1793."],"vocab":[["la Bastille","the Bastille"],["la monarchie constitutionnelle","constitutional monarchy"]],"note":null,"noteEn":null},{"heading":"Première République et Premier Empire","fr":["La Première République commence en 1792. La France affronte des guerres et des révoltes intérieures. La Terreur marque une période de surveillance et de répression des ennemis supposés de la Révolution.","En 1799, Napoléon Bonaparte prend le pouvoir. Il devient empereur en 1804. Son régime met notamment en place le Code civil, la Banque de France et l’organisation préfectorale.","Après ses défaites militaires, Napoléon abdique définitivement en 1815."],"en":["The First Republic began in 1792. France faced wars and internal revolts. The Reign of Terror was marked by surveillance and repression of suspected enemies of the Revolution.","In 1799 Napoleon Bonaparte seized power. He became emperor in 1804. His regime notably established the Civil Code, Bank of France and prefectural administration.","After military defeats, Napoleon finally abdicated in 1815."],"vocab":[["la Terreur","Reign of Terror"],["le Code civil","Civil Code"],["abdiquer","to abdicate"]],"note":null,"noteEn":null}]},{"id":"p4-du-xixe-sicle-la-cinquime-rpublique","part":4,"title":"Du XIXe siècle à la Cinquième République","sourcePages":"42-46","sections":[{"heading":"De 1815 à 1870","fr":["Après Napoléon, la monarchie est restaurée. La Deuxième République est proclamée en 1848 : le suffrage universel masculin est instauré et l’esclavage est aboli définitivement dans les colonies françaises.","Louis-Napoléon Bonaparte devient Napoléon III et fonde le Second Empire, qui dure jusqu’en 1870."],"en":["After Napoleon, the monarchy was restored. The Second Republic was proclaimed in 1848: universal male suffrage was introduced and slavery was definitively abolished in the French colonies.","Louis-Napoleon Bonaparte became Napoleon III and founded the Second Empire, which lasted until 1870."],"vocab":[["abolir l’esclavage","to abolish slavery"],["le Second Empire","Second Empire"]],"note":null,"noteEn":null},{"heading":"Troisième République, guerres mondiales et Libération","fr":["La Troisième République s’installe à partir de 1870. Les grandes lois scolaires développent l’école publique, gratuite, obligatoire et laïque. La loi de 1905 organise la séparation des Églises et de l’État.","La Première Guerre mondiale se déroule de 1914 à 1918. Pendant la Seconde Guerre mondiale, le régime de Vichy collabore avec l’Allemagne nazie tandis que la Résistance s’organise.","Le général de Gaulle lance l’appel du 18 juin 1940 depuis Londres. À la Libération, la légalité républicaine est rétablie, les femmes obtiennent le droit de vote et la Sécurité sociale est créée."],"en":["The Third Republic was established from 1870. Major school laws developed free, compulsory and secular public schooling. The 1905 law organised the separation of Churches and the State.","The First World War lasted from 1914 to 1918. During the Second World War, the Vichy regime collaborated with Nazi Germany while the Resistance developed.","General de Gaulle made the Appeal of 18 June 1940 from London. At the Liberation, republican legality was restored, women obtained the right to vote and Social Security was created."],"vocab":[["la Résistance","Resistance"],["la Libération","Liberation"]],"note":null,"noteEn":null},{"heading":"Quatrième et Cinquième République","fr":["La Quatrième République est instaurée en 1946. La Constitution de 1958 fonde la Cinquième République.","Charles de Gaulle devient le premier président de la Cinquième République en 1959. La Cinquième République est le régime politique actuel de la France."],"en":["The Fourth Republic was established in 1946. The 1958 Constitution founded the Fifth Republic.","Charles de Gaulle became the first President of the Fifth Republic in 1959. The Fifth Republic is France’s current political system."],"vocab":[["la Cinquième République","Fifth Republic"]],"note":null,"noteEn":null}]},{"id":"p4-prsidents-territoire-et-gographie","part":4,"title":"Présidents, territoire et géographie","sourcePages":"47-52","sections":[{"heading":"Les présidents de la Cinquième République","fr":["Les présidents de la Cinquième République sont Charles de Gaulle, Georges Pompidou, Valéry Giscard d’Estaing, François Mitterrand, Jacques Chirac, Nicolas Sarkozy, François Hollande et Emmanuel Macron.","De nombreuses personnalités naturalisées ont également contribué au rayonnement de la France, parmi lesquelles Marc Chagall, Marguerite Yourcenar, Joséphine Baker, Haroun Tazieff, Romain Gary et Françoise Giroud."],"en":["The Presidents of the Fifth Republic are Charles de Gaulle, Georges Pompidou, Valéry Giscard d’Estaing, François Mitterrand, Jacques Chirac, Nicolas Sarkozy, François Hollande and Emmanuel Macron.","Many naturalised personalities also contributed to France’s influence, including Marc Chagall, Marguerite Yourcenar, Josephine Baker, Haroun Tazieff, Romain Gary and Françoise Giroud."],"vocab":[["le rayonnement","influence/prestige"]],"note":null,"noteEn":null},{"heading":"Territoire et place dans le monde","fr":["La France compte environ 68,6 millions d’habitants en 2025 et son territoire s’étend sur la métropole et l’outre-mer.","La France métropolitaine partage des frontières avec l’Allemagne, Andorre, la Belgique, l’Espagne, l’Italie, le Luxembourg, Monaco et la Suisse. Son littoral donne sur la Manche, la mer du Nord, l’océan Atlantique et la mer Méditerranée.","La France fait partie des grandes puissances mondiales et joue un rôle important dans les relations internationales."],"en":["France had about 68.6 million inhabitants in 2025 and its territory includes metropolitan and overseas France.","Metropolitan France shares borders with Germany, Andorra, Belgium, Spain, Italy, Luxembourg, Monaco and Switzerland. Its coastline opens onto the English Channel, North Sea, Atlantic Ocean and Mediterranean Sea.","France is one of the world’s major powers and plays an important role in international relations."],"vocab":[["une frontière","border"],["le littoral","coastline"],["une puissance mondiale","world power"]],"note":null,"noteEn":null}]},{"id":"p4-culture-et-patrimoine","part":4,"title":"Culture et patrimoine","sourcePages":"53-60","sections":[{"heading":"Musées et accès à la culture","fr":["La culture française s’est construite au fil des siècles et se manifeste à travers le patrimoine architectural, la littérature, la musique, les arts visuels, les festivals et les traditions locales.","La France compte plus de 1 200 musées. Le Louvre est l’un des plus grands musées d’art au monde et expose notamment La Joconde. Le musée d’Orsay est célèbre pour ses collections impressionnistes et postimpressionnistes.","Les bibliothèques, médiathèques, festivals et Journées du patrimoine contribuent à rendre la culture accessible à tous."],"en":["French culture developed over centuries and is expressed through architectural heritage, literature, music, visual arts, festivals and local traditions.","France has more than 1,200 museums. The Louvre is one of the world’s largest art museums and notably displays the Mona Lisa. The Musée d’Orsay is famous for Impressionist and Post-Impressionist collections.","Libraries, media libraries, festivals and Heritage Days help make culture accessible to everyone."],"vocab":[["le patrimoine","heritage"],["une médiathèque","media library"],["l’impressionnisme","Impressionism"]],"note":null,"noteEn":null},{"heading":"Artistes et patrimoine architectural","fr":["Parmi les artistes et écrivains cités figurent Rouget de Lisle, George Sand, Baudelaire, Cézanne, Rodin, Monet, Renoir, Debussy, Suzanne Valadon, Simone de Beauvoir, Albert Camus, Marguerite Duras et Édith Piaf.","La tour Eiffel, le Mont-Saint-Michel et le Palais des Papes à Avignon figurent parmi les exemples emblématiques du patrimoine architectural."],"en":["Artists and writers cited include Rouget de Lisle, George Sand, Baudelaire, Cézanne, Rodin, Monet, Renoir, Debussy, Suzanne Valadon, Simone de Beauvoir, Albert Camus, Marguerite Duras and Édith Piaf.","The Eiffel Tower, Mont-Saint-Michel and the Palace of the Popes in Avignon are among the emblematic examples of architectural heritage."],"vocab":[["un sculpteur","sculptor"],["une abbaye","abbey"],["le patrimoine architectural","architectural heritage"]],"note":null,"noteEn":null},{"heading":"Langue, festivités, sport et gastronomie","fr":["Le français est parlé par plus de 300 millions de personnes dans le monde et constitue une langue officielle dans de nombreux pays. La francophonie rassemble les peuples qui utilisent la langue française.","Le 14 juillet est à la fois une fête institutionnelle et populaire. D’autres dates comme le 1er mai, le 8 mai et le 11 novembre rythment également la vie nationale.","Le sport et la gastronomie participent au patrimoine et au rayonnement de la France. Le repas gastronomique des Français est inscrit au patrimoine culturel immatériel de l’UNESCO."],"en":["French is spoken by more than 300 million people worldwide and is an official language in many countries. The Francophonie brings together peoples who use the French language.","14 July is both an official and popular celebration. Other dates such as 1 May, 8 May and 11 November also mark national life.","Sport and gastronomy contribute to France’s heritage and international influence. The gastronomic meal of the French is listed as UNESCO intangible cultural heritage."],"vocab":[["la francophonie","French-speaking world"],["un jour férié","public holiday"],["la gastronomie","gastronomy"]],"note":null,"noteEn":null}]},{"id":"p5-se-loger","part":5,"title":"Se loger","sourcePages":"62","sections":[{"heading":"Devenir propriétaire","fr":["Toute personne peut devenir propriétaire d’un bien immobilier ancien ou neuf. L’achat doit faire l’objet d’un acte signé chez un notaire.","Pour construire une maison, il faut déposer en mairie une demande de permis de construire. Les modifications extérieures ou extensions sont généralement soumises à déclaration préalable ou à autorisation.","L’accession sociale à la propriété aide certains foyers à revenus modestes à devenir propriétaires de leur résidence principale."],"en":["Anyone may become the owner of an existing or newly built property. The purchase must be formalised by a deed signed before a notary.","To build a house, an application for planning permission must be filed at the town hall. Exterior alterations or extensions generally require prior declaration or authorisation.","Social home-ownership schemes help some lower-income households become owners of their main residence."],"vocab":[["un notaire","notary"],["un permis de construire","planning permission"]],"note":null,"noteEn":null},{"heading":"Être locataire","fr":["En France, une part importante de la population est locataire, et une partie des logements loués appartient au parc social.","Les relations entre propriétaire et locataire sont encadrées par un contrat de location. Le locataire paie le loyer et les charges ; le propriétaire doit fournir un logement décent.","Certains travaux décoratifs sont possibles sans autorisation, mais les transformations importantes nécessitent l’accord du propriétaire."],"en":["A significant share of the population in France rents its home, and some rented housing belongs to the social-housing sector.","The relationship between landlord and tenant is governed by a rental contract. The tenant pays rent and charges; the owner must provide decent housing.","Certain decorative work may be carried out without permission, but major alterations require the owner’s agreement."],"vocab":[["un locataire","tenant"],["le loyer","rent"],["les charges","service charges"]],"note":null,"noteEn":null}]},{"id":"p5-se-dplacer-sassurer-et-espace-public","part":5,"title":"Se déplacer, s’assurer et espace public","sourcePages":"63-65","sections":[{"heading":"Le code de la route","fr":["Le code de la route s’applique à tous les usagers de l’espace routier. Le respect des règles est essentiel pour la sécurité de tous.","Pour conduire un véhicule motorisé sur la voie publique, il faut notamment un permis de conduire valide, une carte grise, une assurance et un contrôle technique à jour.","Les infractions peuvent entraîner des amendes, des retraits de points, la suspension du permis et, pour les faits les plus graves, des peines de prison."],"en":["The Highway Code applies to everyone using roads and streets. Respecting the rules is essential for everyone’s safety.","To drive a motor vehicle on public roads, a person notably needs a valid driving licence, vehicle registration document, insurance and an up-to-date roadworthiness test.","Offences may lead to fines, penalty points, licence suspension and, for the most serious offences, imprisonment."],"vocab":[["le code de la route","Highway Code"],["une carte grise","vehicle registration document"]],"note":null,"noteEn":null},{"heading":"Assurance et responsabilité civile","fr":["Certaines assurances sont obligatoires. La responsabilité civile correspond à l’obligation de réparer les dommages que l’on cause à autrui dans certaines situations.","Vivre dans l’espace public implique de respecter les autres, la tranquillité, la propreté et la sécurité."],"en":["Certain insurance is compulsory. Civil liability means the obligation to compensate for damage caused to another person in certain situations.","Living in public space requires respect for other people, peace, cleanliness and safety."],"vocab":[["la responsabilité civile","civil liability"],["un dommage","damage"]],"note":null,"noteEn":null}]},{"id":"p5-environnement-sant-et-urgences","part":5,"title":"Environnement, santé et urgences","sourcePages":"66-69","sections":[{"heading":"Préserver l’environnement","fr":["Chaque année, un Français produit environ 500 kg de déchets. La collecte et le tri sont organisés localement. Depuis 2024, le tri des déchets verts et alimentaires destinés au compostage est obligatoire.","Les dépôts sauvages sont interdits. La consommation d’énergie a un impact sur les émissions de gaz à effet de serre ; des gestes simples permettent de réduire cette consommation.","Les transports en commun, la marche, le vélo, le covoiturage et une conduite plus souple permettent de réduire l’impact environnemental des déplacements."],"en":["Each year, a person in France produces around 500 kg of waste. Collection and sorting are organised locally. Since 2024, sorting green and food waste intended for composting has been compulsory.","Illegal dumping is prohibited. Energy consumption affects greenhouse-gas emissions; simple actions can reduce consumption.","Public transport, walking, cycling, car-sharing and smoother driving can reduce the environmental impact of travel."],"vocab":[["le tri des déchets","waste sorting"],["le compostage","composting"],["le covoiturage","car-sharing"]],"note":null,"noteEn":null},{"heading":"Santé et Assurance Maladie","fr":["La Sécurité sociale est créée en 1945 dans un objectif de solidarité nationale et est financée par des cotisations et des impôts.","Toute personne vivant en France peut consulter un médecin, aller à l’hôpital ou en pharmacie. Les résidents doivent être affiliés à l’Assurance Maladie selon leur situation. La carte Vitale permet de justifier ses droits.","Une mutuelle complémentaire peut prendre en charge une partie des frais restant après remboursement. Les professionnels de santé doivent respecter le secret médical."],"en":["Social Security was created in 1945 as part of national solidarity and is financed by contributions and taxes.","Anyone living in France may see a doctor, go to hospital or visit a pharmacy. Residents must be affiliated with Health Insurance according to their situation. The Vitale card proves health-insurance rights.","A supplementary health insurer may cover part of the remaining costs. Health professionals must respect medical confidentiality."],"vocab":[["l’Assurance Maladie","Health Insurance"],["la carte Vitale","Vitale card"],["une mutuelle","supplementary insurer"]],"note":null,"noteEn":null},{"heading":"Numéros d’urgence","fr":["Les principaux numéros sont le 15 pour le SAMU, le 17 pour la police et la gendarmerie, le 18 pour les pompiers, le 112 comme numéro européen et le 114, notamment accessible par SMS pour les personnes sourdes ou malentendantes."],"en":["Key emergency numbers are 15 for emergency medical services, 17 for police and gendarmerie, 18 for firefighters, 112 as the European emergency number and 114, notably accessible by text message for deaf or hard-of-hearing people."],"vocab":[["le SAMU","emergency medical service"],["les pompiers","firefighters"]],"note":null,"noteEn":null}]},{"id":"p5-travailler-en-france","part":5,"title":"Travailler en France","sourcePages":"70-72","sections":[{"heading":"Droit du travail","fr":["Le droit du travail organise les relations entre salariés et employeurs. Le Code du travail fixe notamment les règles relatives au contrat, aux conditions de travail, au salaire et à la durée légale de 35 heures par semaine.","Les conventions collectives adaptent certaines règles à un secteur d’activité. Le règlement intérieur fixe certaines règles internes dans les entreprises concernées.","Les salariés doivent percevoir au moins le SMIC. Les discriminations sont interdites. En cas de litige individuel, le conseil de prud’hommes est compétent. Chaque travailleur a le droit d’adhérer à un syndicat."],"en":["Employment law governs relations between employees and employers. The Labour Code notably sets rules on contracts, working conditions, pay and the statutory 35-hour working week.","Collective agreements adapt certain rules to a sector. Internal regulations set some workplace rules in the companies concerned.","Employees must receive at least the statutory minimum wage. Discrimination is prohibited. Individual disputes may be heard by the labour court. Every worker has the right to join a trade union."],"vocab":[["le SMIC","minimum wage"],["une convention collective","collective agreement"],["le conseil de prud’hommes","labour court"]],"note":null,"noteEn":null},{"heading":"Contrat, insertion et création d’entreprise","fr":["Le contrat de travail précise notamment le salaire, les compétences nécessaires, la date de début, la durée du travail et le type de contrat. Les formes courantes sont le CDD, le CDI et l’intérim.","France Travail accompagne les personnes dans la recherche d’emploi, peut proposer des formations et, sous conditions, verser l’allocation d’aide au retour à l’emploi. Les Missions Locales accompagnent notamment les jeunes de moins de 25 ans.","Chacun peut créer une entreprise en France sans être nécessairement français. Les démarches varient selon l’activité et peuvent concerner l’immatriculation, les statuts, les annonces légales et le siège social."],"en":["An employment contract notably states pay, required skills, start date, working time and the type of contract. Common forms include fixed-term, permanent and temporary-agency contracts.","France Travail supports jobseekers, may offer training and, subject to conditions, pay the return-to-work allowance. Local youth employment services notably support people under 25.","Anyone may create a business in France without necessarily being French. Procedures vary according to the activity and may include registration, articles of association, legal notices and the registered office."],"vocab":[["un CDD","fixed-term contract"],["un CDI","permanent contract"],["France Travail","public employment service"],["immatriculer","to register a business"]],"note":null,"noteEn":null}]},{"id":"p5-vie-familiale-enfants-et-ducation","part":5,"title":"Vie familiale, enfants et éducation","sourcePages":"73-76","sections":[{"heading":"Le mariage et les droits des parents","fr":["En France, seul le mariage civil célébré en mairie est reconnu par la loi. Le mariage est possible à partir de 18 ans, sauf dérogations exceptionnelles prévues par la loi. La polygamie est interdite.","Depuis 2013, le mariage est ouvert aux couples de même sexe. En cas de séparation, le divorce peut être judiciaire ou, dans certains cas, organisé par consentement mutuel devant un notaire.","La loi protège l’emploi pendant la grossesse et le congé maternité. Le congé paternité dure 28 jours. Des congés parentaux peuvent permettre d’interrompre ou réduire l’activité pour élever un enfant."],"en":["In France, only a civil marriage celebrated at the town hall is recognised by law. Marriage is generally possible from age 18, subject to exceptional legal derogations. Polygamy is prohibited.","Since 2013, marriage has been open to same-sex couples. In the event of separation, divorce may be judicial or, in some cases, arranged by mutual consent before a notary.","The law protects employment during pregnancy and maternity leave. Paternity leave lasts 28 days. Parental leave may allow work to be stopped or reduced in order to raise a child."],"vocab":[["le mariage civil","civil marriage"],["la polygamie","polygamy"],["le congé paternité","paternity leave"]],"note":null,"noteEn":null},{"heading":"Droits des enfants et obligations parentales","fr":["La Convention internationale des droits de l’enfant protège des droits comme l’égalité, le nom et l’identité, la santé, l’alimentation, l’éducation, la vie privée, la protection contre la violence et l’exploitation ainsi que le droit de s’exprimer.","L’autorité parentale est un ensemble de droits et de devoirs destinés à protéger l’intérêt de l’enfant et son bien-être. Les parents doivent protéger sa sécurité, sa santé, sa vie privée et son éducation.","L’autorité parentale s’exerce sans violences physiques ou psychologiques. Les mutilations et châtiments corporels sont interdits."],"en":["The Convention on the Rights of the Child protects rights such as equality, name and identity, health, food, education, privacy, protection from violence and exploitation, and the right to express oneself.","Parental authority is a set of rights and duties designed to protect the child’s best interests and well-being. Parents must protect safety, health, privacy and education.","Parental authority must be exercised without physical or psychological violence. Mutilation and corporal punishment are prohibited."],"vocab":[["l’autorité parentale","parental authority"],["les châtiments corporels","corporal punishment"]],"note":null,"noteEn":null},{"heading":"Éducation et numérique","fr":["L’instruction est obligatoire de 3 à 16 ans. L’école maternelle commence à 3 ans, l’école élémentaire accueille les enfants ensuite, puis viennent le collège et le lycée.","Les parents participent à la communauté éducative et peuvent devenir représentants de parents d’élèves.","Les écrans peuvent avoir des effets sur la santé et la vie sociale des enfants. La loi de 2023 fixe la majorité numérique à 15 ans. La citoyenneté numérique vise un usage responsable, éthique et sûr des technologies."],"en":["Education is compulsory from ages 3 to 16. Nursery school begins at age 3, followed by elementary school, then middle school and high school.","Parents take part in the educational community and may become parent representatives.","Screens can affect children’s health and social life. A 2023 law sets the digital age of consent at 15. Digital citizenship promotes responsible, ethical and safe use of technology."],"vocab":[["l’instruction obligatoire","compulsory education"],["la majorité numérique","digital age of consent"],["la citoyenneté numérique","digital citizenship"]],"note":null,"noteEn":null}]}]'),o2={PARTS:c2,READINGS:r2},f2={1:[{type:"mcq",q:"Quelle est la devise de la République française ?",options:["Liberté, Égalité, Fraternité","Travail, Justice, Solidarité","Unité, Laïcité, Liberté"],answer:0,explanation:"La devise officielle est « Liberté, Égalité, Fraternité »."},{type:"fill",q:"Complétez : La langue officielle de la République est le _____.",answer:"français"},{type:"truefalse",q:"La laïcité signifie que l’État choisit une religion officielle.",answer:!1,explanation:"La laïcité impose la neutralité de l’État vis-à-vis des religions."},{type:"matching",q:"Associez chaque symbole à sa signification.",pairs:[["La Marseillaise","Hymne national"],["14 juillet","Fête nationale"],["Marianne","Symbole de la République"],["Drapeau tricolore","Bleu, blanc, rouge"]]},{type:"ordering",q:"Remettez ces événements dans l’ordre chronologique.",items:["Prise de la Bastille (1789)","Fête de la Fédération (1790)","Le drapeau tricolore devient officiel (1794)","Le 14 juillet devient fête nationale (1880)"]},{type:"short",q:"Expliquez avec vos mots ce que signifie la liberté en France.",model:"La liberté permet à chacun de faire ses choix, penser et s’exprimer, dans le respect de la loi et des droits des autres."}],2:[{type:"mcq",q:"Quelles sont les deux chambres du Parlement ?",options:["Assemblée nationale et Sénat","Sénat et Gouvernement","Conseil constitutionnel et Assemblée nationale"],answer:0,explanation:"Le Parlement est composé de l’Assemblée nationale et du Sénat."},{type:"fill",q:"Le Président de la République est élu rents ?",model:"Les parents doivent protéger leur enfant, veiller à sa santé et à sa sécurité, assurer son éducation, respecter sa dignité et sa vie privée, et l’accompagner dans ses usages numériques."}]},O1=[{part:1,question:"Quelle est la devise de la République française ?",options:["Liberté, Égalité, Fraternité","Travail, Justice, Solidarité","Unité, Laïcité, Liberté"],answer:0,explanation:"La devise réunit trois valeurs fondatrices."},{part:1,question:"Quelle est la langue officielle de la République ?",options:["L’anglais","Le français","Le latin"],answer:1,explanation:"Le français est la langue officielle."},{part:1,question:"Que garantit la laïcité ?",options:["Une religion d’État","La liberté de conscience et la neutralité de l’État","L’interdiction de toutes les croyances"],answer:1,explanation:"L’État est neutre à l’égard des religions."},{part:1,question:"Quelles sont les couleurs du drapeau français ?",options:["Bleu, blanc, rouge","Vert, blanc, rouge","Bleu, jaune, blanc"],answer:0,explanation:"Le drapeau tricolore est bleu, blanc et rouge."},{part:2,question:"Quelles sont les deux chambres du Parlement ?",options:["Assemblée nationale et Sénat","Sénat et Gouvernement","Conseil constitutionnel et Sénat"],answer:0,explanation:"Le Parlement comprend l’Assemblée nationale et le Sénat."},{part:2,question:"Combien de temps dure le mandat du Président de la République ?",options:["Quatre ans","Cinq ans","Sept ans"],answer:1,explanation:"Le mandat présidentiel dure cinq ans."},{part:2,question:"Comment les sénateurs sont-ils élus ?",options:["Au suffrage universel direct","Au suffrage universel indirect","Par tirage au sort"],answer:1,explanation:"Leur élection est indirecte."},{part:2,question:"Qui administre une commune ?",options:["Le maire et le conseil municipal","Le Président et les ministres","Le Sénat"],answer:0,explanation:"Une commune est gérée par un maire et un conseil municipal."},{part:3,question:"Que signifie la présomption d’innocence ?",opti
